<style>
:root{color-scheme:dark;--ink:#e4eff8;--muted:#95aabb;--rim:#4e6878;--gold:#c8ab79;--ice:#9bdafe;--plate:#131e29}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:flex;flex-direction:column;gap:7px;padding:7px 9px;background:#090f16;color:var(--ink);font:14px system-ui,sans-serif}
nav{display:flex;gap:5px}button{flex:1;min-height:40px;border:1px solid var(--rim);border-radius:5px;background:linear-gradient(#314653,#14202a 60%);color:var(--ink);font:600 13px system-ui}
button[hidden],select[hidden]{display:none!important}button:disabled{opacity:.48}button[aria-selected=true]{color:#e4f7ff;border-color:var(--ice);box-shadow:inset 0 0 12px #4aaee855}

#level{display:grid;place-content:center;color:var(--gold);font-weight:bold}.meter{min-width:0;text-align:center;font-size:11px;white-space:nowrap}

section[hidden]{display:none}.row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:6px}
.slot{position:relative;display:grid;place-items:center;min-height:56px;background:#0c1822;border:1px solid #526575;border-radius:5px;padding:4px;color:var(--gold)}
.slot img{width:34px;height:34px;object-fit:contain}.slot small{font-size:11px}.slot img[hidden]{display:none}.slot.off img{opacity:.4}.slot span{position:absolute;right:4px;top:4px;font-size:10px;color:var(--ice)}
#status{font-size:11px;color:var(--muted);margin:0 2px}#chatLog{font-size:13px;overflow-wrap:anywhere}#chatLog div{padding:3px;border-bottom:1px solid #264050}

.chips button,.tools button{flex:0 1 auto;padding:0 10px}.tools select,form input{flex:1;min-width:0;padding:7px;background:#0d1924;color:var(--ink);border:1px solid var(--rim);border-radius:4px}
form button{flex:0 0 auto;padding:0 9px}.slot{font-weight:normal}.slot:disabled{opacity:.65}
#mapImage{width:100%;height:calc(100% - 52px);object-fit:contain}.active{border-color:var(--ice);color:var(--ice)}
#feedback:empty{display:none}#feedback{position:absolute;bottom:9px;left:14px;background:#121f2d;border:1px solid var(--rim);padding:6px;z-index:5}
:focus-visible{outline:2px solid var(--ice);outline-offset:-2px}

.controlGuide{display:grid;grid-template-columns:1fr 1fr;gap:5px 14px;margin:8px 0 16px}.guideRow{display:flex;align-items:center;gap:10px;min-height:36px;border-bottom:1px solid #2a4251}.guideKey{display:grid;place-items:center;min-width:48px;border:1px solid #607889;border-radius:8px;padding:5px;color:#b9dff4;background:#172c39;font-weight:700}.guideAction{color:#e0e9ee} .controller{display:grid;grid-template-columns:1.5fr 1fr;align-items:center;gap:12px;margin:6px 0 12px}

<script>
const $=id=>document.getElementById(id), tabs=[...document.querySelectorAll('nav button')];
const keys={'4':'X','5':'Y','6':'R1','A3':'L2','A4':'A','A5':'B','A6':'R2'};
for(const [index,key] of Object.entries({0:'A4',1:'A5',2:'4',3:'5',5:'6',6:'A3',7:'A6'}))keys['C4_'+index]='L1 + '+keys[key];
const padCodes={BUTTON_X:'2',BUTTON_Y:'3',BUTTON_R1:'4',BUTTON_L2:'5',BUTTON_A:'6',BUTTON_B:'7',BUTTON_R2:'8'};
let d={},tab=0,mode=false,cursor=-1,group='inv',row=0,macroSlot=0,pending=false,complete,timer,restored=false,lastSelect=null,mapRequested=false;
let skillBindings={},macroBindings={},whisper='', selectedSkill='', pickSkill=false, pickMacro=false;
try{
 const old=JSON.parse(localStorage.getItem('bindings')||'{}');
 const saved=JSON.parse(localStorage.getItem('controllerProfiles')||'null');
 skillBindings=saved?.skills||Object.fromEntries(Object.entries(old).filter(([,b])=>b.type==='spell'));
 macroBindings=saved?.macros||Object.fromEntries(Object.entries(old).filter(([,b])=>b.type==='macro'));
 delete skillBindings['3'];delete macroBindings['3'];
 const rows=new Set();
 for(const [k,b] of Object.entries(macroBindings)){
  if(!keys[k]||rows.has(b.value))delete macroBindings[k];else rows.add(b.value);
 }
 for(const k of Object.keys(skillBindings))if(!keys[k]||macroBindings[k])delete skillBindings[k];
 whisper=localStorage.getItem('lastWhisper')||'';
}catch{}
const activeBindings=()=>({...skillBindings,...macroBindings});
const same=(a,b)=>Object.keys(a||{}).length===Object.keys(b||{}).length&&Object.entries(a||{}).every(([k,v])=>b?.[k]?.type===v.type&&b[k].value===v.value);
function notice(msg){$('feedback').textContent=msg;clearTimeout(timer);timer=setTimeout(()=>$('feedback').textContent='',2200)}
const queuedNavigation=[];
function send(type,value,done){
 if(pending){if(type==='nav')queuedNavigation.push([type,value,done]);else if(type!=='pad')notice('One action at a time');return}
 if(!d.online){notice('USB link unavailable');return}
 pending=true;complete=done;
 location.href='kaldorathor://action?data='+encodeURIComponent(JSON.stringify({type,value}));
}
window.actionResult=ok=>{pending=false;const callback=complete;complete=null;if(ok)callback?.();else notice('Action not confirmed');if(!pending&&queuedNavigation.length)send(...queuedNavigation.shift())};
function select(i){
 const previous=tab;
 tab=(i+tabs.length)%tabs.length;cursor=-1;
 tabs.forEach((b,j)=>{b.setAttribute('aria-selected',j===tab);$(b.dataset.tab).hidden=j!==tab});
 if(previous===1&&tab!==1&&mapRequested){mapRequested=false;if(!pending&&d.online)send('mapRestore','')}
 if(tab===1&&d.online&&!pending){mapRequested=true;send('mapView','')}
 if(tab===2)$('chatLog').scrollTop=$('chatLog').scrollHeight;
}
tabs.forEach((b,i)=>b.onclick=()=>select(i));select(0);
function btn(label,fn,on=false){const b=document.createElement('button');b.type='button';b.textContent=label;b.onclick=fn;if(on)b.classList.add('active');return b}
function addIcon(node,src){if(src){const i=document.createElement('img');i.src=src;i.alt='';node.append(i)}}
function controls(){return [...document.querySelectorAll('section:not([hidden]) button:not(:disabled):not([hidden]),section:not([hidden]) select,section:not([hidden]) input')].filter(el=>el.getClientRects().length)}
function focusAt(index){
 const c=controls();if(!c.length)return;
 cursor=(index+c.length)%c.length;c[cursor].focus({preventScroll:true});c[cursor].scrollIntoView({block:'nearest'});
}
function toggleNav(){
 mode=!mode;cursor=-1;
 if(mode){notice('Companion navigation');cursor=-1;tabs[tab].focus({preventScroll:true})}else{document.activeElement.blur();notice('Game controls')}
}
window.padKey=k=>{
 const index=physical[k];
 if(index!=null){localHeld.add(index);inspected=index;drawController();if(capture){capturePress(index);return}}
 if(k==='BUTTON_START'){if(mode)toggleNav();select(4);send('nav','start');return}
 const native={DPAD_UP:'up',DPAD_DOWN:'down',DPAD_LEFT:'left',DPAD_RIGHT:'right',DPAD_CENTER:'accept',BUTTON_A:'downAccept',BUTTON_B:'back'};
 if(d.nativeMenu&&native[k]){if(mode)toggleNav();send('nav',native[k]);return}
 if(!d.nativeMenu&&!mode&&localHeld.has(4)&&index!==4&&index!=null&&activeBindings()['C4_'+index]){send('combo','C4_'+index);return}
 if(k==='BUTTON_THUMBL'||k==='BUTTON_THUMBR'){if(!mode&&!d.nativeMenu)send('combat',k==='BUTTON_THUMBL'?'target':'attack');return}
 if(k==='BUTTON_SELECT'||k==='BUTTON_MODE'){toggleNav();return}
 if(mode){
  if(k==='DPAD_LEFT'||k==='DPAD_RIGHT'){select(tab+(k==='DPAD_RIGHT'?1:-1));focusAt(0)}
  if(k==='DPAD_UP'||k==='DPAD_DOWN')focusAt(cursor+(k==='DPAD_DOWN'?1:-1));
  if(k==='BUTTON_A'){const el=controls()[cursor];if(el?.tagName==='INPUT'||el?.tagName==='SELECT')el.focus();else el?.click()}
  if(k==='BUTTON_B')toggleNav();
 }else if(padCodes[k])send('pad',padCodes[k]);
};
const physical={BUTTON_A:0,BUTTON_B:1,BUTTON_X:2,BUTTON_Y:3,BUTTON_L1:4,BUTTON_R1:5,BUTTON_L2:6,BUTTON_R2:7,BUTTON_SELECT:8,BUTTON_START:9,BUTTON_THUMBL:10,BUTTON_THUMBR:11,DPAD_UP:12,DPAD_DOWN:13,DPAD_LEFT:14,DPAD_RIGHT:15,DPAD_CENTER:0};
const sourceFor={0:'A4',1:'A5',2:'4',3:'5',5:'6',6:'A3',7:'A6'};
const defaults=['Interact / skill','Back / skill','Skill','Skill','Reserved','Skill','Skill','Skill','Companion navigation','Game menu','Target next','Basic attack','Menu up','Menu down','Menu left','Menu right'];
const localHeld=new Set();
let capture=null;
function beginCapture(kind){
 if(kind==='skill'&&!selectedSkill){notice('Pick a skill first');return}
 capture={kind,pressed:new Set(),candidate:new Set(),ready:false};
 $('captureDialog').hidden=false;$('captureConfirm').disabled=true;$('captureForce').hidden=true;
 $('captureMessage').textContent='Press a button, then release it.';
 document.querySelector('.captureCard').classList.remove('error');
}
function capturePress(index){
 if(!capture.pressed.size){capture.candidate.clear();document.querySelector('.captureCard').classList.remove('error')}
 capture.pressed.add(index);capture.candidate.add(index);capture.ready=false;
 $('captureConfirm').disabled=true;
}
function captureRelease(){
 if(!capture)return;
 capture.pressed=new Set([...capture.pressed].filter(i=>localHeld.has(i)));
 if(capture.pressed.size)return;
 const values=[...capture.candidate],other=values.find(i=>i!==4),key=values.length===2&&values.includes(4)?'C4_'+other:sourceFor[values[0]],binding=activeBindings()[key];
 let error='';
 if(values.length>1&&!(values.length===2&&values.includes(4)&&keys[key]))error='Use L1 with one assignable button.';
 else if(!key)error='This button is reserved for game controls.';
 else if(binding&&(capture.kind==='skill'?(binding.type!=='spell'||binding.value!==selectedSkill):(binding.type!=='macro'||binding.value!==String(row))))error='This button is already assigned to '+(binding.type==='macro'?'macro row '+(+binding.value+1):'a skill')+'.';
 capture.ready=!error;capture.key=key;
 const conflict=!!binding&&!!error&&!!keys[key]&&error.startsWith('This button');
 capture.canReplace=conflict;
 $('captureForce').hidden=!conflict;
 if(conflict){
  const detail=binding.type==='macro'?'Macro row '+(+binding.value+1)+' (Macros)':
    ((d.slots||[]).find(slot=>slot.id===binding.value)?.name||'Skill')+' (Skills)';
  error=keys[key]+' is assigned to '+detail+'. Replace it or change it in '+(binding.type==='macro'?'Macros':'Skills')+'.';
 }
 document.querySelector('.captureCard').classList.toggle('error',!!error);
 $('captureMessage').textContent=error||keys[key]+' is available.';
 $('captureConfirm').disabled=!!error;
}
$('recordSkill').onclick=()=>beginCapture('skill');
$('recordMacro').onclick=()=>beginCapture('macro');
$('captureCancel').onclick=()=>{capture=null;$('captureDialog').hidden=true};
$('captureForce').onclick=()=>{
 if(!capture?.canReplace)return;
 const {kind,key}=capture;
 const skills={...skillBindings},macros={...macroBindings};
 delete skills[key];delete macros[key];
 if(kind==='skill'){
  for(const [k,b] of Object.entries(skills))if(b.value===selectedSkill)delete skills[k];
  skills[key]={type:'spell',value:selectedSkill};pickSkill=false;
 }else{
  for(const [k,b] of Object.entries(macros))if(b.value===String(row))delete macros[k];
  macros[key]={type:'macro',value:String(row)};
 }
 capture=null;$('captureDialog').hidden=true;save(skills,macros);
};
$('captureConfirm').onclick=()=>{
 if(!capture?.ready)return;
 const {kind,key}=capture;capture=null;$('captureDialog').hidden=true;
 const select=$(kind==='skill'?'skillBind':'macroBind');
 select.value=key;
 $(kind==='skill'?'assignSkill':'bindMacro').click();
};

let inspected, lastPress, controllerLayout='';
window.padRelease=k=>{
 const index=physical[k];
 if(index!=null){localHeld.delete(index);drawController();if(capture){captureRelease();return}if(k==='BUTTON_A'&&d.nativeMenu)send('nav','upAccept')}
};
window.resetPad=()=>{localHeld.clear();drawController()};
function drawGuide(){
 const entries=[['Left stick','Move'],['Right stick','Camera'],['L3','Target next'],['R3','Basic attack'],['Start','Game menu'],['Select','Companion navigation'],['D-pad','Navigate menus'],['A / B','Confirm / back'],...Object.entries(keys).map(([key,label])=>[label,activeBindings()[key]?.type==='macro'?'Macro row '+(+activeBindings()[key].value+1):activeBindings()[key]?.type==='spell'?(d.slots?.find(s=>s.id===activeBindings()[key].value)?.name||'Assigned skill'):'Default action'])];
 if(d.nativePad)entries.splice(2,entries.length-2,...Object.entries(physical).filter(([k])=>k.startsWith('BUTTON_')).map(([k,i])=>[k.replace('BUTTON_',''),d.nativePadMap?.[i]?.label||'Nothing']));
 const guide=$('controlGuide'), fingerprint=JSON.stringify(entries);
 if(guide.dataset.entries===fingerprint)return;guide.dataset.entries=fingerprint;
 guide.replaceChildren(...entries.map(([key,action])=>{const line=document.createElement('div');line.className='guideRow';const k=document.createElement('span');k.className='guideKey';k.textContent=key;const a=document.createElement('span');a.className='guideAction';a.textContent=action;line.append(k,a);return line}));
}
function drawController(){
 drawGuide();
 if(d.lastPress?.at&&d.lastPress.at!==lastPress){
  lastPress=d.lastPress.at;inspected=d.lastPress.button;
 }
 const live=new Set([...(d.pressed||[]),...localHeld]);
 document.querySelectorAll('[data-pad]').forEach(e=>e.classList.toggle('on',live.has(+e.dataset.pad)));
 if(inspected==null)return;
 const key=sourceFor[inspected], binding=activeBindings()[key];
 const spellName=id=>d.slots?.find(s=>s.id===id)?.name;
 const options=key&&d.online?[
  ['default','Default action'],
  ...(d.realRows||[]).map((_,i)=>['macro:'+i,'Row '+(i+1)+(d.buffRows?.includes(i)?' · Buff':'')])
   .filter(([value])=>!Object.entries(macroBindings).some(([k,b])=>k!==key&&'macro:'+b.value===value)),
  ...[...new Map((d.slots||[]).filter(s=>s.id).map(s=>[s.id,s])).values()].map(s=>['spell:'+s.id,s.name||'Skill'])
 ]:null;
 const layout=JSON.stringify([inspected,binding,options,d.nativeMenu]);
 if(controllerLayout===layout)return;
 controllerLayout=layout;
 $('controllerButton').textContent=document.querySelector('[data-pad="'+inspected+'"] text')?.textContent||'Controller';
 $('controllerInfo').hidden=false;
 const uiAction=d.nativeMenu&&(inspected===0?'Confirm':inspected===1?'Back':null);
 $('controllerInfo').textContent=uiAction||(binding?.type==='macro'?'Macro row '+(+binding.value+1):binding?.type==='spell'?spellName(binding.value)||'Assigned skill':defaults[inspected]);
 $('controllerAssign').hidden=!options;
 if(options){
  const choice=$('controllerChoice');
  choice.replaceChildren(...options.map(([value,label])=>new Option(label,value)));
  choice.value=binding?binding.type+':'+binding.value:'default';
 }
}
$('controllerSave').onclick=()=>{
 const key=sourceFor[inspected];
 if(!key)return;
 const [type,value]=$('controllerChoice').value.split(':');
 const skills={...skillBindings},macros={...macroBindings};
 delete skills[key];delete macros[key];
 if(type==='macro'&&value!=null)macros[key]={type,value};
 if(type==='spell'&&value!=null)skills[key]={type,value};
 save(skills,macros);
};
$('openGameMenu').onclick=()=>send('nav','start');
window.showInput=()=>{};
function updateChoices(preferRowBinding=false){
 const rebuild=(id,blocked)=>{
  const s=$(id),previous=s.value;
  const available=Object.entries(keys).filter(([k])=>!blocked[k]);
  s.replaceChildren(...available.map(([k,label])=>new Option(label,k)));
  if(available.some(([k])=>k===previous))s.value=previous;
  s.disabled=!available.length;
 };
 rebuild('skillBind',macroBindings);
 const otherRows=Object.fromEntries(Object.entries(macroBindings).filter(([,b])=>b.value!==String(row)));
 rebuild('macroBind',{...skillBindings,...otherRows});
 if(preferRowBinding){
  const key=Object.keys(macroBindings).find(k=>macroBindings[k].value===String(row));
  if(key)$('macroBind').value=key;
 }
}
updateChoices();
function save(skills, macros){
 send('bind',{...skills,...macros},()=>{
  skillBindings=skills;macroBindings=macros;
  localStorage.setItem('controllerProfiles',JSON.stringify({skills,macros}));
  updateChoices(true);drawController();notice('Binding saved');drawSkills(d.slots||[]);drawMacros();
 });
}
$('skillPick').onclick=()=>{
 pickSkill=!pickSkill;selectedSkill='';drawSkills(d.slots||[]);
 if(pickSkill)notice('Tap the skill you want to bind');
};
$('assignSkill').onclick=()=>{
 if(!selectedSkill){notice('Pick a skill first');return}
 const key=$('skillBind').value;
 if(!keys[key]){notice('No free button');return}
 if(macroBindings[key]){notice(keys[key]+' is reserved by a macro');return}
 const next=Object.fromEntries(Object.entries(skillBindings).filter(([k,b])=>k===key||b.value!==selectedSkill));
 save({...next,[key]:{type:'spell',value:selectedSkill}},macroBindings);
 pickSkill=false;
};
$('bindMacro').onclick=()=>{
 const key=$('macroBind').value;
 if(!keys[key]||skillBindings[key]){notice('No free button');return}
 if(macroBindings[key]&&macroBindings[key].value!==String(row)){notice('Button is already bound to another row');return}
 const next=Object.fromEntries(Object.entries(macroBindings).filter(([,b])=>b.value!==String(row)));
 next[key]={type:'macro',value:String(row)};save(skillBindings,next);
};
$('unbindMacro').onclick=()=>save(skillBindings,Object.fromEntries(Object.entries(macroBindings).filter(([,b])=>b.value!==String(row))));
$('clearSkill').onclick=()=>{
 if(!selectedSkill){notice('Pick a skill first');return}
 const key=Object.keys(skillBindings).find(k=>skillBindings[k].value===selectedSkill);
 if(!key){notice('This skill has no saved binding');return}
 const next={...skillBindings};delete next[key];save(next,macroBindings);
};
function setMacroSlot(tid){
 if(!d.realRows?.[row]?.[macroSlot])return;
 send('macroSlot',{row,slot:macroSlot,tid:Number(tid)},()=>{pickMacro=false;drawMacros();notice('Slot updated')});
}
$('pickMacroSkill').onclick=()=>{pickMacro=!pickMacro;drawMacros()};
$('clearMacroSlot').onclick=()=>setMacroSlot(0);
$('runMacro').onclick=()=>send('macro',String(row));

let itemSource='',itemTarget=-1;
function clearItem(){itemSource='';itemTarget=-1;$('itemInfo').textContent='';drawBag()}
$('clearItem').onclick=clearItem;
$('moveItem').onclick=()=>{
 const target=d.inventory?.[group]?.slots?.[itemTarget];
 if(itemSource&&target)send('bagMove',{group,from:itemSource,to:itemTarget,target:target.id},clearItem);
};
for(const [id,g] of [['inventory','inv'],['pet','pet'],['bank','bank']])$(id).onclick=()=>{group=g;clearItem()};
function showWhisper(){$('reply').hidden=!whisper;$('reply').textContent=whisper?'Whisper '+whisper:'Whisper'}
showWhisper();
$('reply').onclick=()=>{const x=$('message');if(!x.value.startsWith('/'))x.value='/w '+whisper+' '+x.value;x.focus()};
$('composer').onsubmit=e=>{
 e.preventDefault();const x=$('message'),m=x.value.trim();if(!m)return;
 send('chat',m,()=>{const target=/^\/w\s+(\S+)\s+\S/i.exec(m);if(target){whisper=target[1];localStorage.setItem('lastWhisper',whisper);showWhisper()}
 if(x.value.trim()===m)x.value=''});
};
let skillLayout='', skillNodes=[], skillCategory='All';
function drawSkills(slots){
 const ordered=[], used=new Set();
 const displayedKeys=Object.entries(keys);
 for(const [key,label] of displayedKeys){
  if(macroBindings[key])continue;
  const binding=skillBindings[key];
  const match=binding?slots.find(x=>x.id===binding.value):slots.find(x=>x.key===key&&!Object.values(skillBindings).some(b=>b.value===x.id));
  if(match?.id){ordered.push({...match,label});used.add(match.id)}
 }
 for(const x of slots)if(x.id&&!used.has(x.id)){ordered.push({...x,label:''});used.add(x.id)}
 const categories=['All',...new Set(ordered.map(x=>x.group||'Other'))];
 if(!categories.includes(skillCategory))skillCategory='All';
 $('skillCategories').replaceChildren(...categories.map(name=>btn(name,()=>{skillCategory=name;drawSkills(d.slots||[])},name===skillCategory)));
 const shown=skillCategory==='All'?ordered:ordered.filter(x=>(x.group||'Other')===skillCategory);
 const layout=JSON.stringify(shown.map(x=>[x.id,x.icon,x.label]));
 if(layout!==skillLayout){
  skillLayout=layout;skillNodes=[];$('skills').replaceChildren();
  for(let i=0;i<shown.length;i+=4){
   const line=document.createElement('div');line.className='row';
   for(const x of shown.slice(i,i+4)){
    const b=btn('',()=>{
     if(pickSkill){selectedSkill=x.id;const assigned=Object.keys(skillBindings).find(k=>skillBindings[k].value===x.id);if(assigned)$('skillBind').value=assigned;drawSkills(d.slots||[]);notice(assigned?'Current binding selected':'Choose a controller button, then Bind')}
     else send('spell',x.id,()=>{b.classList.add('castFlash');setTimeout(()=>b.classList.remove('castFlash'),230)});
    });
    b.className='slot';
    b.setAttribute('aria-label',d.catalog?.find(c=>c.icon===x.icon)?.name||'Equipped skill');
    const art=document.createElement('div');art.className='art';addIcon(art,x.icon);
    const cd=document.createElement('div');cd.className='cooldown';art.append(cd);
    const label=document.createElement('small');label.textContent=x.label;
    b.append(art,label);line.append(b);skillNodes.push({b,cd});
   }
   $('skills').append(line);
  }
 }
 shown.forEach((x,i)=>{
  const {b,cd}=skillNodes[i];
  b.disabled=!pickSkill&&(x.disabled||!!x.cooldown);
  b.classList.toggle('selected',x.id===selectedSkill);
  b.classList.toggle('noMana',!!x.disabled);
  cd.hidden=!x.cooldown;cd.textContent=x.cooldown||'';
 });
 $('skillPick').setAttribute('aria-pressed',String(pickSkill));
 $('skillPick').textContent=pickSkill?'Cancel pick':'Pick skill';
}
function drawMacros(){
 $('macroRows').replaceChildren(...Array.from({length:4},(_,i)=>btn(
  'Row '+(i+1)+(d.buffRows?.includes(i)?' · Buff':'')+(Object.entries(macroBindings).filter(([,b])=>b.value===String(i)).map(([k])=>' · '+keys[k]).join('')),
  ()=>{row=i;macroSlot=0;pickMacro=false;updateChoices(true);drawMacros()},i===row)));
 const skills=d.catalog||[], slots=d.realRows?.[row]||[];
 $('macroSlots').replaceChildren(...slots.map((s,i)=>{
  const skill=skills.find(k=>k.tid===s.tid);
  const b=btn('',()=>{macroSlot=i;pickMacro=true;drawMacros()},i===macroSlot);
  b.classList.add('slot');b.disabled=s.item;
  if(skill)addIcon(b,skill.icon);else b.textContent=s.item?'Item':'+';
  b.setAttribute('aria-label',skill?.name||'Slot '+(i+1));return b;
 }));
 $('pickMacroSkill').setAttribute('aria-expanded',String(pickMacro));
 $('macroPalette').hidden=!pickMacro;
 $('macroPalette').replaceChildren(...skills.map(s=>{
  const b=btn(s.icon?'':s.name,()=>setMacroSlot(s.tid));
  b.title=s.name;b.setAttribute('aria-label',s.name);addIcon(b,s.icon);return b;
 }));
}
function drawBag(){
 const bag=d.inventory?.[group]||{};
 $('bagTabs').replaceChildren(...(bag.tabs||[]).map((t,i)=>btn(t.name,()=>send('bagTab',{group,index:i},clearItem),t.on)));
 $('bagGrid').replaceChildren(...(bag.slots||[]).map((s,i)=>{
  const b=btn('',()=>{
   if(!itemSource&&s.id){itemSource=s.id;$('itemInfo').textContent=s.hint||'Select a destination slot'}
   else if(s.id===itemSource){clearItem();return}
   else{itemTarget=i;$('itemInfo').textContent='Move to slot '+(i+1)+'?'}
   drawBag();
  },(!!s.id&&s.id===itemSource)||i===itemTarget);
  b.classList.add('slot');b.disabled=!s.id&&!itemSource;
  b.setAttribute('aria-label',s.id?'Item in slot '+(i+1):'Empty slot '+(i+1));
  addIcon(b,s.icon);
  if(s.count){const n=document.createElement('small');n.textContent=s.count;b.append(n)}
  return b;
 }));
 $('moveItem').hidden=itemTarget<0;$('clearItem').hidden=!itemSource;
}
let rendered={};
function changed(id,value,fn){const key=JSON.stringify(value);if(rendered[id]===key)return;rendered[id]=key;fn(value)}
window.renderGame=state=>{
 d=state;
 document.body.classList.remove('native-pad');
 document.querySelectorAll('.nativeHint').forEach(el=>el.hidden=true);
 drawController();
 changed('nativeControls',d.nativeMenu||'',menu=>{
  if(menu&&mode)toggleNav();
  $('nativeControls').hidden=!menu;
  $('nativeControls').replaceChildren(...(menu?[['↑','up'],['↓','down'],['←','left'],['→','right'],['A','accept'],['B','back']].map(([label,key])=>btn(label,()=>send('nav',key))):[]));
 });
 for(const [id,label] of [['level','Level'],['hp','HP'],['mp','MP'],['xp','EXP']])$(id).textContent=d[id]||label+' —';
 document.querySelectorAll('.fill').forEach((e,i)=>e.style.width=Math.min(100,Math.max(0,d.bars?.[i]||0))+'%');
 if(!d.online){restored=false;lastSelect=null;mapRequested=false}
 if(d.online&&!pending&&!same(d.bindings,activeBindings())&&Date.now()-(restored||0)>2000){restored=Date.now();send('bind',activeBindings())}
 const status=$('macroState');
 status.textContent=d.online?(d.activeRow!==''&&d.activeRow!=null&&+d.activeRow>=0?'Row '+(+d.activeRow+1)+' active':''):'USB link unavailable';
 if(d.lastMacro&&!d.lastMacro.ok&&Date.now()-d.lastMacro.at<2200)status.textContent='Row '+(+d.lastMacro.row+1)+' did not start. Check its slots.';
 if(d.online&&lastSelect!==null&&d.select!==lastSelect)toggleNav();
 lastSelect=d.online?d.select:null;
 if(tab===1&&d.online&&!mapRequested&&!d.map&&!pending){mapRequested=true;send('mapView','')}
 changed('skills',[d.slots,d.nativePadMap,d.nativePad],()=>drawSkills(d.slots||[]));
 changed('map',d.map||'',m=>{$('mapImage').hidden=!m;$('mapHint').hidden=!!m;if(m)$('mapImage').src=m});
 changed('filters',d.filters||[],f=>$('filters').replaceChildren(...f.filter(x=>x.name).map(x=>btn(x.name,()=>send('filter',x.name),x.on))));
 changed('chat',d.chat||[],m=>{
  $('chatLog').replaceChildren(...m.map(x=>{const el=document.createElement('div');el.textContent=x.text;el.style.color=x.color;return el}));
  $('chatLog').scrollTop=$('chatLog').scrollHeight;
 });
 changed('macro',[d.realRows,d.catalog,d.buffRows],drawMacros);
 changed('bag',d.inventory,drawBag);
 changed('npc',d.npc,npc=>{
  $('npc').hidden=!npc;$('npc').replaceChildren();
  if(!npc)return;
  const name=document.createElement('b');name.textContent=npc.name;$('npc').append(name);
  const panel=document.createElement('div');panel.className='tools';
  npc.choices.forEach(c=>{const b=btn(c.label,()=>send('npc',c.label,()=>{if(c.label==='Storage'){group='bank';drawBag()}}));b.disabled=c.disabled;panel.append(b)});
  $('npc').append(panel);
 });
};
renderGame({});
</script>
</html>
